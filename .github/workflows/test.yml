name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续 push 时，旧的那次已经没意义了，直接取消，别白烧 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 门禁脚本大量往 stdout 打 ✓/✅，而 runner 的 Python 标准输出跟随系统区域编码
# （windows-latest 是 cp1252，连 ✓ 都编不出来）→ 不设这行，scenario job 会在
# 第一次打印时 UnicodeEncodeError 红掉，报的还不是被测代码的问题。
env:
  PYTHONIOENCODING: utf-8

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: "~\\AppData\\Local\\pip\\Cache"
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 运行测试
        # AI 用例默认跳过（需要真实模型配额）；这里只跑确定性用例。
        # 前端点击测试复用 runner 自带的 Edge（channel=msedge），不需要下载 Chromium。
        run: python -m pytest -v

  scenario:
    # 场景测试用真 uvicorn 子进程 + 真 MCP stdio，一直游离在 pytest 之外，
    # 于是"改坏了没人知道"。这里把它钉进 CI，失败即红。
    runs-on: windows-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: "~\\AppData\\Local\\pip\\Cache"
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 场景测试（真服务 + 真 MCP）
        run: python scripts/scenario_test.py

  package:
    # 打包才能暴露的问题（例如 -w 模式下标准流为 None 导致 uvicorn 崩溃）在 pytest 里永远是盲区，
    # 所以每次 push 都真打一次包 + 真启动 exe 打接口。
    runs-on: windows-latest
    needs: [pytest, scenario]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: "~\\AppData\\Local\\pip\\Cache"
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 安装依赖
        # pyinstaller 只在 requirements-dev.txt 里（build.bat 是单独装的）——
        # 这一 job 原来只装 requirements.txt，下一步 python -m PyInstaller 必然 ModuleNotFoundError。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 生成构建戳
        # 冻结态取不到源码 mtime，版本条读的就是这个戳；漏了会显示"未知"
        run: python scripts/make_stamp.py

      - name: 打包
        run: |
          python -m PyInstaller -F -w -n "AI交接看板" scripts\desktop.py `
            --hidden-import app.main --hidden-import uvicorn `
            --add-data "$($PWD.Path)\web;web" --paths "$($PWD.Path)" `
            --icon "$($PWD.Path)\app.ico" `
            --distpath dist --workpath build --specpath build --noconfirm
        shell: pwsh

      - name: 冻结版自查（真启动 exe 并打接口）
        # KANBAN_NO_WINDOW=1：CI 没有桌面会话，只服务不开窗
        # 数据目录由 frozen_smoke.py 自己指定（%TEMP%\kanban_frozen_smoke），这里不用传
        env:
          KANBAN_NO_WINDOW: "1"
        run: python scripts/frozen_smoke.py

      - name: 上传 exe
        # 原来打完包什么也不留：exe 随 runner 一起销毁，CI 从不产出可安装产物。
        # 放在冻结版自查之后 —— 只有真起得来、接口打得通的包才值得被下载。
        uses: actions/upload-artifact@v4
        with:
          name: ai-kanban-windows
          path: dist/AI交接看板.exe
          if-no-files-found: error

      - name: 启动日志（失败时定位用）
        if: failure()
        run: |
          Get-Content "$env:TEMP\kanban_frozen_smoke\startup.log" -ErrorAction SilentlyContinue
          Get-ChildItem dist
        shell: pwsh
