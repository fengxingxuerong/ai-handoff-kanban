# 与本地**同一个入口**：`scripts/ci_local.py`。
# 刻意不复刻一份步骤清单 —— 两处各写一遍必然漂，而这个项目已经为"两条路给不同答案"付过几次代价。
#
# ✅ 已实测跑通（2026-10-11 接上远端后）：run #1（de1dfe2）success 约 7 分钟、
# run #2（a3af088）success **7 分 35 秒**（16:33:11 → 16:40:46 UTC），job 名 `gates`。
# 首跑把当初"预计要微调"的三条逐条验证掉：
#   1. Windows runner 上没有系统 Edge/Chrome，界面门禁走的正是 `playwright install chromium`
#      这级降级 —— 那一步真的被执行且成功（这就是它存在的理由）。
#   2. `requirements.lock.txt` 在本机 Python 3.13 上生成，这里钉同一个版本，安装无解析偏差。
#   3. 实测整条流水线 7 分 35 秒（当初估 8–15 分钟；本地 ci_local --with-exe 约 4 分 50 秒，
#      差额是 runner 上的装依赖与 checkout）。
# 历史：接远端之前它从未被执行过（"看起来对"不作数）—— 这也是当初只保留这一份工作流的原因。
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    # 只在 Windows 上跑：这个产品就是发 Windows 桌面 exe，锁文件也在 Windows 上生成，
    # 拿 ubuntu 跑等于测一条永远不会交付的路径。
    runs-on: windows-latest
    timeout-minutes: 40
    # 日常 push 只有读权限的步骤照常；tag 推送时的 Release 步骤需要 contents: write。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 按锁文件安装（可复现，不靠 >= 现场解析）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: 装 Playwright 自带 chromium（界面门禁的第三级降级）
        run: python -m playwright install chromium

      - name: 全部门禁 + 重新打包 + 冻结版冒烟
        run: python scripts/ci_local.py --with-exe

      # 发布只发生在 tag 推送、且门禁全绿之后（上一步失败 job 就停，轮不到这里）。
      # tag 必须与 app/version.py 同源 —— 版本号是单一事实来源，CI 是最后一道对账。
      - name: tag 与 version.py 必须同源
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, re, sys
          from pathlib import Path
          m = re.search(r'^__version__ = "([^"]+)"',
                        Path("app/version.py").read_text(encoding="utf-8"), re.M)
          tag = os.environ["GITHUB_REF_NAME"]
          if not m or tag != "v" + m.group(1):
              sys.exit(f"tag {tag} 与 version.py 的 v{m.group(1) if m else '?'} 不一致 —— 先对齐再打 tag")

      - name: 发布 GitHub Release（两个 exe，正文自动生成）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: 上传 exe（两个产物都留：GUI 主程序 + MCP 控制台服务）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-kanban-exe
          path: |
            dist/AI交接看板.exe
            dist/AI交接看板-MCP.exe
          if-no-files-found: warn
