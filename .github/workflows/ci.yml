# 与本地**同一个入口**：`scripts/ci_local.py`。
# 刻意不复刻一份步骤清单 —— 两处各写一遍必然漂，而这个项目已经为"两条路给不同答案"付过几次代价。
#
# ✅ 已实测跑通（2026-10-11 接上远端后）：run #1（de1dfe2）success 约 7 分钟、
# run #2（a3af088）success **7 分 35 秒**（16:33:11 → 16:40:46 UTC），job 名 `gates`。
# 首跑把当初"预计要微调"的三条逐条验证掉：
#   1. Windows runner 上没有系统 Edge/Chrome，界面门禁走的正是 `playwright install chromium`
#      这级降级 —— 那一步真的被执行且成功（这就是它存在的理由）。
#   2. `requirements.lock.txt` 在本机 Python 3.13 上生成，这里钉同一个版本，安装无解析偏差。
#   3. 实测整条流水线 7 分 35 秒（当初估 8–15 分钟；本地 ci_local --with-exe 约 4 分 50 秒，
#      差额是 runner 上的装依赖与 checkout）。
# 历史：接远端之前它从未被执行过（"看起来对"不作数）—— 这也是当初只保留这一份工作流的原因。
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    # 只在 Windows 上跑：这个产品就是发 Windows 桌面 exe，锁文件也在 Windows 上生成，
    # 拿 ubuntu 跑等于测一条永远不会交付的路径。
    runs-on: windows-latest
    timeout-minutes: 40
    # 日常 push 只有读权限的步骤照常；tag 推送时的 Release 步骤需要 contents: write。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 按锁文件安装（可复现，不靠 >= 现场解析）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: 装 Playwright 自带 chromium（界面门禁的第三级降级）
        run: python -m playwright install chromium

      - name: 全部门禁 + 重新打包 + 冻结版冒烟
        run: python scripts/ci_local.py --with-exe

      # 发布只发生在 tag 推送、且门禁全绿之后（上一步失败 job 就停，轮不到这里）。
      # tag 必须与 app/version.py 同源 —— 版本号是单一事实来源，CI 是最后一道对账。
      - name: tag 与 version.py 必须同源
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, re, sys
          from pathlib import Path
          m = re.search(r'^__version__ = "([^"]+)"',
                        Path("app/version.py").read_text(encoding="utf-8"), re.M)
          tag = os.environ["GITHUB_REF_NAME"]
          if not m or tag != "v" + m.group(1):
              sys.exit(f"tag {tag} 与 version.py 的 v{m.group(1) if m else '?'} 不一致 —— 先对齐再打 tag")

      # 资产名必须 ASCII：GitHub 的资产名清理会剥掉 CJK 字符（2026-10-24 首跑实测
      # `AI交接看板.exe` 被传成 `AI.exe`），dist 里的中文文件名保留不动 ——
      # 复制成带 tag 的 ASCII 名再传，下载链接从此可打字、可分享、不会被改坏。
      - name: 发布 GitHub Release（资产用 ASCII 名，正文自动生成）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist/AI交接看板.exe" "dist/AI-Handoff-Kanban-${GITHUB_REF_NAME}.exe"
          cp "dist/AI交接看板-MCP.exe" "dist/AI-Handoff-Kanban-MCP-${GITHUB_REF_NAME}.exe"
          gh release create "$GITHUB_REF_NAME" \
            "dist/AI-Handoff-Kanban-${GITHUB_REF_NAME}.exe" \
            "dist/AI-Handoff-Kanban-MCP-${GITHUB_REF_NAME}.exe" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: 上传 exe（两个产物都留：GUI 主程序 + MCP 控制台服务）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-kanban-exe
          path: |
            dist/AI交接看板.exe
            dist/AI交接看板-MCP.exe
          if-no-files-found: warn

  # OCI 产物是官方 MCP Registry 的发布前提（server.json 的 packages 指向 GHCR），
  # 也是非 Windows 用户跑 MCP 的正路。挂在 gates 之后：门禁绿的提交才有资格出镜像。
  container:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 镜像版本取自 app/version.py（单一事实来源，不手填）
        id: ver
        run: |
          echo "version=$(python -c "import re;print(re.search(r'^__version__ = \"([^\"]+)\"', open('app/version.py', encoding='utf-8').read(), re.M).group(1))")" >> "$GITHUB_OUTPUT"

      - name: 构建镜像
        run: |
          docker build -t ghcr.io/fengxingxuerong/ai-handoff-kanban-mcp:${{ steps.ver.outputs.version }} \
                       -t ghcr.io/fengxingxuerong/ai-handoff-kanban-mcp:latest .

      # 无状态协议：一条 tools/list 直接打，不需要握手。断言 >= 23 个工具
      # （阈值按实测值钉，与 live_check 的口径一致——砍掉一半工具这条必须红）。
      - name: 容器真冒烟（tools/list 断言 23 工具）
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | docker run -i --rm \
            ghcr.io/fengxingxuerong/ai-handoff-kanban-mcp:${{ steps.ver.outputs.version }} > /tmp/mcp_out.jsonl
          python3 - <<'PYEOF'
          import json
          tools = None
          err = None
          for ln in open('/tmp/mcp_out.jsonl', encoding='utf-8'):
              ln = ln.strip()
              if not ln:
                  continue
              d = json.loads(ln)
              if d.get('id') == 1:
                  if 'result' in d:
                      tools = d['result'].get('tools', [])
                  elif 'error' in d:
                      err = d['error']
          assert tools is not None, f'容器内 tools/list 没有回结果（error={err}）'
          assert len(tools) >= 23, f'容器内工具数 {len(tools)} < 23 —— 镜像与源码漂移'
          print(f'容器内 MCP 冒烟通过：{len(tools)} 个工具')
          PYEOF

      - name: 登录 GHCR 并推送（版本号 + latest 两个 tag）
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/fengxingxuerong/ai-handoff-kanban-mcp:${{ steps.ver.outputs.version }}
          docker push ghcr.io/fengxingxuerong/ai-handoff-kanban-mcp:latest
