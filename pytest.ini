[pytest]
testpaths = tests
# -n auto：并行（实测 135s → 41s）。慢的是子进程类用例（真服务/真 MCP/真浏览器），
#   它们彼此独立，xdist 正好把这些墙钟时间叠起来。
# --timeout：CI 兜底。用例挂死时不要占满整条流水线，超时直接判失败。
# --reruns：**本机环境抖动兜底**，不是"掩盖失败"。
#   现象：-n auto 跑偶尔有 2-4 条红，全部是 Windows 文件锁 / 杀软扫描类 PermissionError，
#   孤立复跑和 -n0 串行跑都全绿（2026-09-17 实测）。真失败重跑 2 次仍然会红并照常计入失败。
#   试过的另一种解法（把抢资源的模块用 xdist_group 钉在一个 worker 串行）有效但把 57s 拖到 140s，
#   不划算，已放弃。
addopts = -q --cov=app --cov-branch --cov-config=.coveragerc --cov-report=term-missing:skip-covered -n auto --timeout=180 --reruns 2 --reruns-delay 1
# tmp_path 回收策略：默认会删掉旧会话的临时目录，一次全量跑要删几百个条目。
# 在开了"批量删除保护"的环境里（杀软/沙箱/受管终端）这会让 pytest 在收尾阶段被直接掐掉，
# 表现为「跑完 100% 却没有 summary」。改成 none = 不主动删，交给系统 temp 清理机制。
tmp_path_retention_policy = none
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using .httpx.*:Warning

[coverage:run]
# 分支开关写在上面的 addopts 里（`--cov-branch`），**不要指望这里的 branch = true 生效**：
# pytest-cov 自己构造 source/开关，2026-09-23 实测把 branch=true 放这里，报告仍然是
# 纯行覆盖（表头没有 Branch 列），换成语义相同的一行 addopts 才量到 838 个分支。
# 打开分支覆盖后实测 93% → 92%，门槛仍是 90，所以这不是"数字变好看"而是"数字变真"：
# 以前 `if 条件: 走对的那支` 单独就算满，而 else / except 那支（缺陷常待的地方）不进分母。
#
# **度量不到的地方必须显式排除，不能靠"它在 source 之外"这条巧合**（2026-10-25 被 ci_local 抓到）：
# MCP 服务（23 个工具的出口，现在住在 app/mcp_server.py）是**子进程**跑的 ——
# 行为用例故意走真 stdio（见测试约定 ①「拒绝 mock 自证」），所以进程内行覆盖量不到它：
# 实测它自己 655 条语句里只有 14% 进得来。此前它放在 scripts/ 下、天然不进 source=app 的分母，
# 于是这段说明是对的但**脆**；搬进包里的那一刻分母从 3657 涨到 4312、总覆盖率 93.8% → 81%，
# 门禁当场红（红得对：这个模块的覆盖率从没被统计过，只是过去没人看见）。
# 现在显式 omit，并说明**谁替它作证**：
#   · tests/test_mcp_server.py 经真 tools/call 逐工具验，判据是那条
#     「注册并广播的每个工具都至少被用例调用过一次」；
#   · scripts/mcp_frozen_smoke.py（ci_local 里的独立一步）对着**源码与冻结产物**各跑一遍
#     九条断言（stdout 是合法 JSON-RPC / 中文双向不乱码 / 真写进隔离目录）。
# omit 表不许扩大，且上面那两层必须还在 —— 钉子见
# tests/test_suite_hygiene.py::test_coverage_exclusion_is_explicit_and_has_a_verifier
#
# 机制在 `.coveragerc`（`--cov-config` 指过去）—— 这个 `[coverage:run]` 段里的
# `source` 是**惰性的**：真正决定 source 的是 addopts 的 `--cov=app`（2026-10-25 实测，
# omit 写在这里四种写法全无效）。留着那段说明是因为它讲清了"为什么这个模块不进分母"，
# 但**别在这里加开关** —— 加了不会生效，只会让下一个人以为配过了。

[coverage:report]
# 同上：这个 fail_under 对退出码无效，发版门禁显式传 --cov-fail-under（见硬性约定 21）。
fail_under = 90
